<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<meta http-equiv="Pragma" content="no-cache">
<meta http-equiv="Expires" content="0">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>チャンピオン登録</title>
<style>
* { box-sizing: border-box; }
body {
  background: #0f172a;
  color: #e5e7eb;
  font-family: sans-serif;
  margin: 0;
  padding: 20px;
}
h1, h2 { margin: 0; }
.header {
  display: flex;
  justify-content: space-between;
  align-items: center;
  gap: 16px;
  margin-bottom: 20px;
  flex-wrap: wrap;
}
.nav {
  display: flex;
  gap: 10px;
  flex-wrap: wrap;
}
.nav a, .nav .nav-btn {
  background: #1e293b;
  color: #e5e7eb;
  text-decoration: none;
  padding: 10px 14px;
  border: 1px solid #334155;
  border-radius: 8px;
  width: auto;
  font: inherit;
  font-weight: 600;
  white-space: nowrap;
}
.nav a:hover, .nav .nav-btn:hover { background: #334155; }
.container {
  display: flex;
  gap: 30px;
  align-items: flex-start;
}
.form-area {
  width: 320px;
  background: #111827;
  border: 1px solid #334155;
  border-radius: 14px;
  padding: 16px;
  position: sticky;
  top: 20px;
}
input {
  width: 100%;
  padding: 10px;
  margin-bottom: 15px;
  background: #1e293b;
  border: 1px solid #334155;
  color: white;
  border-radius: 8px;
}
button {
  width: 100%;
  padding: 10px;
  background: #d4af37;
  border: none;
  cursor: pointer;
  font-weight: bold;
  border-radius: 8px;
}
button:hover { opacity: 0.85; }
#paste-area {
  border: 2px dashed #64748b;
  padding: 20px;
  text-align: center;
  margin-bottom: 15px;
  background: #1e293b;
  border-radius: 10px;
  min-height: 180px;
}
#preview {
  max-width: 100%;
  max-height: 220px;
  margin-top: 10px;
  border-radius: 8px;
}
.info-box {
  margin-top: 12px;
  padding: 10px;
  font-size: 14px;
  line-height: 1.5;
  color: #cbd5e1;
  background: #1e293b;
  border: 1px solid #334155;
  border-radius: 10px;
}
.list-area { flex: 1; min-width: 0; }
.toolbar {
  display: flex;
  flex-direction: column;
  gap: 12px;
  margin-bottom: 16px;
}
.search-row {
  display: flex;
  gap: 10px;
  align-items: center;
  flex-wrap: wrap;
}
.search-row input {
  margin: 0;
  max-width: 320px;
}
.tag-filters {
  display: flex;
  gap: 8px;
  flex-wrap: wrap;
}
.tag-filter {
  width: auto;
  padding: 8px 12px;
  background: #1e293b;
  color: #e5e7eb;
  border: 1px solid #334155;
}
.tag-filter.active {
  background: #d4af37;
  color: #111827;
  border-color: #d4af37;
}
.champion-list {
  display: grid;
  grid-template-columns: repeat(auto-fill, 140px);
  gap: 15px;
}
.champion-card {
  background: #1e293b;
  padding: 10px;
  text-align: center;
  border: 1px solid #334155;
  border-radius: 10px;
}
.champion-card img {
  width: 110px;
  height: 110px;
  object-fit: cover;
  border-radius: 8px;
}
.champion-card .name {
  margin-top: 8px;
  word-break: break-word;
  min-height: 40px;
  display: flex;
  align-items: center;
  justify-content: center;
}
.card-actions {
  display: flex;
  flex-direction: column;
  gap: 6px;
  margin-top: 8px;
}
.card-actions button {
  padding: 6px;
  font-size: 12px;
}
.edit-btn { background: #3b82f6; color: white; }
.delete-btn { background: #ef4444; color: white; }
.empty { color: #94a3b8; padding: 20px 0; }
.modal-backdrop {
  position: fixed;
  inset: 0;
  background: rgba(2, 6, 23, 0.72);
  display: none;
  align-items: center;
  justify-content: center;
  padding: 20px;
  z-index: 1000;
}
.modal-backdrop.open { display: flex; }
.modal {
  width: min(560px, 100%);
  background: #111827;
  border: 1px solid #334155;
  border-radius: 16px;
  padding: 20px;
  box-shadow: 0 10px 30px rgba(0,0,0,0.35);
}
.modal h3 { margin-top: 0; margin-bottom: 14px; }
.preview-box {
  margin-bottom: 14px;
  text-align: center;
  background: #1e293b;
  border: 1px solid #334155;
  border-radius: 10px;
  padding: 12px;
}
.preview-box img {
  width: 160px;
  height: 160px;
  object-fit: cover;
  border-radius: 10px;
}
.tag-section { margin-bottom: 14px; }
.tag-section-title {
  margin-bottom: 8px;
  color: #d4af37;
  font-weight: bold;
}
.tag-options {
  display: flex;
  gap: 8px;
  flex-wrap: wrap;
}
.tag-option {
  display: inline-flex;
  align-items: center;
  gap: 6px;
  background: #1e293b;
  border: 1px solid #334155;
  border-radius: 999px;
  padding: 8px 12px;
}
.modal-actions {
  display: flex;
  justify-content: flex-end;
  gap: 10px;
  flex-wrap: wrap;
}
.modal-actions button {
  width: auto;
  padding: 10px 14px;
}
.secondary-btn {
  background: #1e293b;
  color: #e5e7eb;
  border: 1px solid #334155;
}

@media (max-width: 900px) {
  body { padding: 14px; }
  .header { align-items: flex-start; }
  .nav {
    width: 100%;
    gap: 8px;
  }
  .nav a, .nav .nav-btn {
    flex: 1 1 calc(50% - 8px);
    text-align: center;
    padding: 10px 12px;
    font-size: 14px;
  }
  .container {
    flex-direction: column;
    gap: 18px;
  }
  .form-area {
    width: 100%;
    position: static;
  }
  .list-area { width: 100%; }
  .toolbar { gap: 10px; }
  .search-row {
    flex-direction: column;
    align-items: stretch;
  }
  .search-row input {
    max-width: none;
    width: 100%;
  }
  .tag-filters { gap: 6px; }
  .tag-filter {
    padding: 8px 10px;
    font-size: 13px;
  }
  .champion-list {
    grid-template-columns: repeat(2, minmax(0, 1fr));
    gap: 12px;
  }
  .champion-card img {
    width: 100%;
    height: auto;
    aspect-ratio: 1 / 1;
  }
  .modal {
    width: 100%;
    max-height: 90vh;
    overflow-y: auto;
  }
}
</style>
</head>
<body>
<div class="header">
  <h1>チャンピオン登録</h1>
  <div class="nav">
    <button class="nav-btn" onclick="exportChampions()">チャンピオンエクスポート</button>
    <button class="nav-btn" onclick="triggerChampionImport()">チャンピオンインポート</button>
    <a href="champion.html?v=54">チャンピオン登録</a>
    <a href="team-builder.html?v=54">新規構成</a>
    <a href="index.html?v=54">構成一覧</a>
  </div>
</div>

<div class="container">
  <div class="form-area">
    <input type="text" id="name" placeholder="チャンピオン名">
    <div id="paste-area">
      Ctrl + V で画像貼り付け
      <img id="preview" alt="">
    </div>
    <button onclick="saveChampion()">登録</button>
    <div class="info-box">
      画像は登録時に自動で縮小・圧縮します。<br>
      編集からタグ設定が可能です。<br>
      タグは TOP / JG / MID / ADC / SUP の5種類です。
    </div>
    <div id="seedStatus" class="info-box" style="display:none;"></div>
  </div>

  <div class="list-area">
    <div class="toolbar">
      <div class="search-row">
        <h2>登録済みチャンピオン</h2>
        <input id="searchInput" placeholder="チャンピオン名で検索" oninput="renderList()">
      </div>
      <div class="tag-filters">
        <button class="tag-filter active" data-tag="" onclick="setTagFilter('')">すべて</button>
        <button class="tag-filter" data-tag="TOP" onclick="setTagFilter('TOP')">TOP</button>
        <button class="tag-filter" data-tag="JG" onclick="setTagFilter('JG')">JG</button>
        <button class="tag-filter" data-tag="MID" onclick="setTagFilter('MID')">MID</button>
        <button class="tag-filter" data-tag="ADC" onclick="setTagFilter('ADC')">ADC</button>
        <button class="tag-filter" data-tag="SUP" onclick="setTagFilter('SUP')">SUP</button>
      </div>
    </div>
    <input id="championImportInput" type="file" accept=".json,application/json" style="display:none" onchange="handleChampionImport(event)">
    <div id="championList" class="champion-list"></div>
  </div>
</div>

<div class="modal-backdrop" id="editModal">
  <div class="modal">
    <h3>チャンピオン編集</h3>
    <input type="text" id="editName" placeholder="チャンピオン名">
    <div class="preview-box">
      <div style="margin-bottom:8px;">画像を差し替える場合は Ctrl + V</div>
      <img id="editPreview" alt="">
    </div>
    <div class="tag-section">
      <div class="tag-section-title">タグ設定</div>
      <div class="tag-options">
        <label class="tag-option"><input type="checkbox" value="TOP" class="tag-checkbox"> TOP</label>
        <label class="tag-option"><input type="checkbox" value="JG" class="tag-checkbox"> JG</label>
        <label class="tag-option"><input type="checkbox" value="MID" class="tag-checkbox"> MID</label>
        <label class="tag-option"><input type="checkbox" value="ADC" class="tag-checkbox"> ADC</label>
        <label class="tag-option"><input type="checkbox" value="SUP" class="tag-checkbox"> SUP</label>
      </div>
    </div>
    <div class="modal-actions">
      <button class="secondary-btn" onclick="closeEditModal()">閉じる</button>
      <button onclick="saveEditChampion()">保存</button>
    </div>
  </div>
</div>

<script src="db.js"></script>
<script src="champion.js?v=54"></script>
</body>
</html>
