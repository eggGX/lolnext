<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<meta http-equiv="Pragma" content="no-cache">
<meta http-equiv="Expires" content="0">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>構成一覧</title>
<link rel="stylesheet" href="index.css?v=58">
</head>
<body>
<div class="header">
  <h1>構成一覧</h1>
  <div class="nav">
    <button class="nav-btn" onclick="triggerImport()">インポート</button>
    <button class="nav-btn" onclick="exportAllTeams()">一括エクスポート</button>
    <a href="champion.html?v=58">チャンピオン登録</a>
    <a href="team-builder.html?v=58">新規構成</a>
    <a href="index.html?v=58">構成一覧</a>
    <span class="account-chip" id="currentAccountName">未ログイン</span>
    <button class="nav-btn logout-btn" id="logoutButton" onclick="logoutAccount()" style="display:none;">ログアウト</button>
  </div>
</div>

<input id="importInput" type="file" accept=".json,application/json" style="display:none" onchange="handleImport(event)">
<div id="teamList" class="team-list"></div>

<div id="authGate" class="auth-gate">
  <div class="auth-card">
    <h2>ログイン</h2>
    <p>同じアカウントでログインすると、構成データが共有されます。</p>
    <label for="authAccountName">アカウント名</label>
    <input id="authAccountName" type="text" autocomplete="username" placeholder="アカウント名">
    <label for="authPassword">パスワード</label>
    <input id="authPassword" type="password" autocomplete="current-password" placeholder="6文字以上">
    <div class="auth-actions">
      <button class="auth-primary" onclick="handleLogin()">ログイン</button>
      <button class="auth-secondary" onclick="handleRegister()">新規登録</button>
    </div>
    <div id="authMessage" class="auth-message"></div>
  </div>
</div>

<script src="https://www.gstatic.com/firebasejs/13.1.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/13.1.0/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/13.1.0/firebase-firestore-compat.js"></script>
<script src="db.js?v=58"></script>
<script src="firebase.js?v=58"></script>
<script src="index.js?v=58"></script>
</body>
</html>
