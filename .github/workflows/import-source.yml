name: Import source repository

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  import-source:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout target
        uses: actions/checkout@v4

      - name: Checkout source
        uses: actions/checkout@v4
        with:
          repository: eggGX/lolteambuildtool
          path: _source

      - name: Copy all source assets and fix Jinx name
        shell: bash
        run: |
          rsync -a --delete \
            --exclude='.git/' \
            --exclude='_source/' \
            --exclude='.github/workflows/import-source.yml' \
            _source/ ./
          python3 - <<'PY'
          from pathlib import Path
          replacements = 0
          for path in [Path('champions.json'), Path('champion.html'), Path('index.html'), Path('team-builder.html'), Path('team-edit.html'), Path('db.js'), Path('lolトリミング.html')]:
              if not path.exists():
                  continue
              text = path.read_text(encoding='utf-8')
              count = text.count('ジンスク')
              if count:
                  path.write_text(text.replace('ジンスク', 'ジンクス'), encoding='utf-8')
                  replacements += count
          print(f'Replaced ジンスク -> ジンクス: {replacements} occurrence(s)')
          PY
          rm -rf .github/workflows/import-source.yml
          rmdir .github/workflows 2>/dev/null || true
          rmdir .github 2>/dev/null || true
          rm -rf _source

      - name: Commit copied repository
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Copy lolteambuildtool and fix Jinx name" || exit 0
          git push
